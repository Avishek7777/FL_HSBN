# configs/base.yaml
#
# HSBN Feedback-Driven FL — Full Gradient Chain
# ================================================
# Server components:
#   Z1  (adapter)    — alignment only, variance loss
#   Z1.5 (classifier)— fine classification from aligned representations
#   Z2  (apex)       — coarse classification + top-down feedback
#
# Gradient chain:
#   coarse_loss → Z2 → z1_5 → Z1.5 (cls_loss) → z1 → Z1 (var_loss)
#                                                      → z0_compressed
#                                                      → bottleneck
#                                                      → local_model

# ── Federated Learning ────────────────────────────────────────────────────────
fl:
  num_clients: 20
  num_rounds: 200
  client_fraction: 0.5
  local_epochs: 5
  lr: 0.001
  arch_dir: "architectures/"
  seed: 42
  warmup_epochs: 1

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  name: "cifar100" # used for checkpoint naming
  root: "data/"
  batch_size: 64
  num_fine_classes: 100
  num_coarse_classes: 20
  dirichlet_alpha: 0.5
  public_samples_per_class: 50
  in_channels: 3 # 1 for FMNIST, 3 for everything else
  input_size: 32 # native input resolution

results_dir: "results/"

# ── Common Space ──────────────────────────────────────────────────────────────
common:
  d1: 128 # bottleneck output dim — all clients compress into this
  d2: 32 # apex compressed dim

# ── Per-Client Bottleneck ─────────────────────────────────────────────────────
channel:
  beta: 64.0 # matches original HSBN channel_01 budget
  gamma: 0.02

# ── Feedback ──────────────────────────────────────────────────────────────────
feedback:
  alpha: 0.15
  frequency: 1
  personalized: false

# ── Server ────────────────────────────────────────────────────────────────────
server:
  adapter_lr: 0.001 # Z1 + server encoder
  classifier_lr: 0.001 # Z1.5
  apex_lr: 0.0005 # Z2
  update_steps: 5
  encoder_dropout: 0.1

# ── Z1 Adapter (alignment only) ───────────────────────────────────────────────
adapter:
  num_heads: 4
  num_layers: 2
  dropout: 0.1
  lambda_var: 0.1 # reduced — soft alignment so class structure survives

# ── Z1.5 Classifier (fine classification) ─────────────────────────────────────
classifier:
  d_cls: 256 # classification representation dim (d1 < d_cls < d0)
  dropout: 0.1

# ── Z2 Apex (coarse classification) ───────────────────────────────────────────
apex:
  hidden_dim: 128 # increased — receives d_cls=256 now, not d1=128
